name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name panel-agent agent/__main__.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/panel-agent

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name panel-agent agent/__main__.py
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: dist/panel-agent.exe
