[project]
name = "discord-panel-agent"
version = "0.0.1"
description = "Discord Panel agent for Windows, macOS, Linux PCs, and VPS hosts"
requires-python = ">=3.11"
dependencies = [
  "discord.py>=2.4.0",
  "websockets>=13.0",
  "pydantic>=2.9.0",
  "keyring>=25.0.0",
  "httpx>=0.27.0",
  "platformdirs>=4.3.0",
  "ulid-py>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
discord-panel-agent = "agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"